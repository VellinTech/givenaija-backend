

services:
  api:
    build: .
    container_name: givenaija_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://givenaija_app:givenaija_app_password@db:5432/givenaija
      - ALEMBIC_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/givenaija
      - REDIS_URL=redis://redis:6379/0
      - FIRESTORE_EMULATOR_HOST=firestore:8080
      - FIRESTORE_PROJECT_ID=givenaija-dev
    depends_on:
      - db
      - redis
      - firestore

  db:
    image: postgres:15-alpine
    container_name: givenaija_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=givenaija
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: givenaija_redis
    ports:
      - "6379:6379"

  firestore:
    image: mtlynch/firestore-emulator-docker
    container_name: givenaija_firestore
    environment:
      - FIRESTORE_PROJECT_ID=givenaija-dev
      - PORT=8080
    ports:
      - "8080:8080"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: givenaija_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: